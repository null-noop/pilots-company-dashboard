<main class="dashboard-shell">
	<app-dashboard-header
		[syncCode]="syncCode()"
		[busy]="busy()"
		[connected]="!!company()"
		[darkMode]="darkMode()"
		(syncCodeChange)="syncCode.set($event)"
		(connectRequested)="connect()"
		(themeToggle)="toggleTheme()"
	/>

	@if (error()) {
		<div class="error-banner" role="alert">{{ error() }}</div>
	}

	@if (company(); as co) {
		<app-company-summary [company]="co" [flights]="air()?.flights ?? []" [held]="air()?.held ?? {}" [updatedAt]="updatedAt()" />

		<div class="content-grid">
			<app-flights-panel class="panel flights-panel" [flights]="air()?.flights ?? []" [now]="air()?.now" />
			<app-holdings-panel class="panel holdings-panel" [held]="air()?.held ?? {}" />
			<app-fleet-panel class="panel fleet-panel" [fleet]="co.fleet" />
			<app-activity-panel class="panel activity-panel" [entries]="co.log" />
			<app-members-panel class="panel members-panel" [members]="co.members" />
		</div>
	} @else {
		<section class="empty-state">
			<h1>No company connected</h1>
			<p>Connect above to load company data.</p>
		</section>
	}

	<footer class="page-footer"><span>Pocket Pilots · Company dashboard</span><span>Sync code stored in this browser</span></footer>
</main>
